<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">So sánh hiệu quả các mô hình dự báo giá nhà TP. Hồ Chí Minh</title>
  <desc id="desc">Biểu đồ so sánh MAE, RMSE và R bình phương của XGBoost, Ridge Regression và Random Forest trên tập kiểm tra.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a43"/>
      <stop offset="1" stop-color="#173e54"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35d0ba"/>
      <stop offset="1" stop-color="#77e6c2"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#061827" flood-opacity=".23"/>
    </filter>
    <style>
      text { font-family: "DejaVu Sans", Arial, sans-serif; }
      .muted { fill: #a8bdca; }
      .body { fill: #183247; }
      .small { font-size: 16px; }
      .value { font-size: 20px; font-weight: 700; fill: #183247; }
      .model { font-size: 17px; font-weight: 600; fill: #314b5e; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#background)"/>
  <circle cx="1510" cy="60" r="210" fill="#2a887f" opacity=".11"/>
  <circle cx="80" cy="850" r="250" fill="#4a76a3" opacity=".12"/>

  <text x="78" y="78" fill="#80e3d0" font-size="16" font-weight="700" letter-spacing="3">DỰ ÁN DỰ BÁO GIÁ NHÀ · TP. HỒ CHÍ MINH</text>
  <text x="78" y="139" fill="#ffffff" font-size="43" font-weight="750" letter-spacing="-1.2">Mô hình nào dự báo tốt hơn?</text>
  <text x="80" y="180" fill="#bed0da" font-size="19">Đánh giá trên tập kiểm tra 20% · 51.132 tin hợp lệ · Đơn vị giá: tỷ đồng</text>

  <g transform="translate(1176 68)">
    <rect width="346" height="57" rx="28" fill="#23495b" stroke="#3b6876"/>
    <circle cx="27" cy="28" r="7" fill="#46d6bd"/>
    <text x="46" y="35" fill="#e6f4f4" font-size="16" font-weight="650">XGBoost</text>
    <circle cx="150" cy="28" r="7" fill="#63a9fa"/>
    <text x="169" y="35" fill="#e6f4f4" font-size="16" font-weight="650">Ridge</text>
    <circle cx="257" cy="28" r="7" fill="#ffae66"/>
    <text x="276" y="35" fill="#e6f4f4" font-size="16" font-weight="650">Random Forest</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="64" y="225" width="472" height="420" rx="22" fill="#f8fbfd"/>
    <rect x="64" y="225" width="472" height="7" rx="4" fill="#46d6bd"/>
    <rect x="564" y="225" width="472" height="420" rx="22" fill="#f8fbfd"/>
    <rect x="564" y="225" width="472" height="7" rx="4" fill="#63a9fa"/>
    <rect x="1064" y="225" width="472" height="420" rx="22" fill="#f8fbfd"/>
    <rect x="1064" y="225" width="472" height="7" rx="4" fill="#ffae66"/>
  </g>

  <g>
    <text x="91" y="277" class="body" font-size="26" font-weight="750">MAE</text>
    <text x="91" y="303" fill="#708696" font-size="15">Sai số tuyệt đối trung bình · tỷ đồng</text>
    <rect x="395" y="252" width="113" height="28" rx="14" fill="#e5f6f1"/>
    <text x="451.5" y="271" text-anchor="middle" fill="#087f6c" font-size="12" font-weight="750">THẤP HƠN TỐT HƠN</text>

    <text x="91" y="353" class="model">XGBoost</text>
    <rect x="245" y="334" width="183" height="24" rx="12" fill="#e9eff3"/>
    <rect x="245" y="334" width="154.3" height="24" rx="12" fill="#46d6bd"/>
    <text x="486" y="353" text-anchor="end" class="value">25,30</text>
    <text x="91" y="435" class="model">Ridge Regression</text>
    <rect x="245" y="416" width="183" height="24" rx="12" fill="#e9eff3"/>
    <rect x="245" y="416" width="158.7" height="24" rx="12" fill="#63a9fa"/>
    <text x="486" y="435" text-anchor="end" class="value">26,02</text>
    <text x="91" y="517" class="model">Random Forest</text>
    <rect x="245" y="498" width="183" height="24" rx="12" fill="#e9eff3"/>
    <rect x="245" y="498" width="168" height="24" rx="12" fill="#ffae66"/>
    <text x="486" y="517" text-anchor="end" class="value">27,54</text>
    <line x1="245" y1="557" x2="428" y2="557" stroke="#d9e3e9"/>
    <text x="245" y="582" fill="#8193a0" font-size="13">0</text>
    <text x="428" y="582" text-anchor="end" fill="#8193a0" font-size="13">30 tỷ</text>
    <text x="91" y="615" fill="#087f6c" font-size="14" font-weight="700">XGBoost có MAE thấp nhất</text>
  </g>

  <g>
    <text x="591" y="277" class="body" font-size="26" font-weight="750">RMSE</text>
    <text x="591" y="303" fill="#708696" font-size="15">Phạt sai số lớn mạnh hơn · tỷ đồng</text>
    <rect x="895" y="252" width="113" height="28" rx="14" fill="#eaf2fc"/>
    <text x="951.5" y="271" text-anchor="middle" fill="#286cac" font-size="12" font-weight="750">THẤP HƠN TỐT HƠN</text>

    <text x="591" y="353" class="model">XGBoost</text>
    <rect x="745" y="334" width="183" height="24" rx="12" fill="#e9eff3"/>
    <rect x="745" y="334" width="153.8" height="24" rx="12" fill="#46d6bd"/>
    <text x="986" y="353" text-anchor="end" class="value">84,05</text>
    <text x="591" y="435" class="model">Ridge Regression</text>
    <rect x="745" y="416" width="183" height="24" rx="12" fill="#e9eff3"/>
    <rect x="745" y="416" width="155.4" height="24" rx="12" fill="#63a9fa"/>
    <text x="986" y="435" text-anchor="end" class="value">84,89</text>
    <text x="591" y="517" class="model">Random Forest</text>
    <rect x="745" y="498" width="183" height="24" rx="12" fill="#e9eff3"/>
    <rect x="745" y="498" width="158.9" height="24" rx="12" fill="#ffae66"/>
    <text x="986" y="517" text-anchor="end" class="value">86,82</text>
    <line x1="745" y1="557" x2="928" y2="557" stroke="#d9e3e9"/>
    <text x="745" y="582" fill="#8193a0" font-size="13">0</text>
    <text x="928" y="582" text-anchor="end" fill="#8193a0" font-size="13">100 tỷ</text>
    <text x="591" y="615" fill="#286cac" font-size="14" font-weight="700">XGBoost có RMSE thấp nhất</text>
  </g>

  <g>
    <text x="1091" y="277" class="body" font-size="26" font-weight="750">R²</text>
    <text x="1091" y="303" fill="#708696" font-size="15">Mức độ mô hình giải thích biến thiên</text>
    <rect x="1427" y="252" width="81" height="28" rx="14" fill="#fff2e5"/>
    <text x="1467.5" y="271" text-anchor="middle" fill="#a85e16" font-size="12" font-weight="750">CAO HƠN TỐT HƠN</text>

    <text x="1091" y="353" class="model">XGBoost</text>
    <rect x="1245" y="334" width="183" height="24" rx="12" fill="#e9eff3"/>
    <line x1="1313.6" y1="329" x2="1313.6" y2="363" stroke="#8295a2" stroke-width="2"/>
    <rect x="1313.6" y="334" width="90.3" height="24" rx="12" fill="#46d6bd"/>
    <text x="1486" y="353" text-anchor="end" class="value">0,0395</text>
    <text x="1091" y="435" class="model">Ridge Regression</text>
    <rect x="1245" y="416" width="183" height="24" rx="12" fill="#e9eff3"/>
    <line x1="1313.6" y1="411" x2="1313.6" y2="445" stroke="#8295a2" stroke-width="2"/>
    <rect x="1313.6" y="416" width="46.2" height="24" rx="12" fill="#63a9fa"/>
    <text x="1486" y="435" text-anchor="end" class="value">0,0202</text>
    <text x="1091" y="517" class="model">Random Forest</text>
    <rect x="1245" y="498" width="183" height="24" rx="12" fill="#e9eff3"/>
    <line x1="1313.6" y1="493" x2="1313.6" y2="527" stroke="#8295a2" stroke-width="2"/>
    <rect x="1256.7" y="498" width="56.9" height="24" rx="12" fill="#ffae66"/>
    <text x="1486" y="517" text-anchor="end" class="value">−0,0249</text>
    <line x1="1245" y1="557" x2="1428" y2="557" stroke="#d9e3e9"/>
    <text x="1245" y="582" fill="#8193a0" font-size="13">−0,03</text>
    <text x="1313.6" y="582" text-anchor="middle" fill="#8193a0" font-size="13">0</text>
    <text x="1428" y="582" text-anchor="end" fill="#8193a0" font-size="13">0,05</text>
    <text x="1091" y="615" fill="#a85e16" font-size="14" font-weight="700">Cả 3 mô hình đều có R² gần 0</text>
  </g>

  <rect x="64" y="685" width="1472" height="142" rx="22" fill="#23495b" stroke="#3b6876"/>
  <rect x="64" y="685" width="8" height="142" rx="4" fill="url(#accent)"/>
  <circle cx="112" cy="733" r="18" fill="#e2b760"/>
  <text x="112" y="740" text-anchor="middle" fill="#193747" font-size="22" font-weight="800">!</text>
  <text x="146" y="739" fill="#ffffff" font-size="22" font-weight="750">Kết quả tốt nhất không đồng nghĩa dự báo đã chính xác</text>
  <text x="110" y="779" fill="#d2e1e7" font-size="17">XGBoost đứng đầu về MAE/RMSE, nhưng R² = 0,0395 cho thấy mô hình hiện giải thích rất ít biến thiên giá.</text>
  <text x="110" y="807" fill="#b8ccd6" font-size="16">Dùng để minh họa quy trình học máy; không dùng làm căn cứ thẩm định hoặc quyết định mua bán.</text>

  <text x="78" y="865" fill="#91aeba" font-size="14">Nguồn: outputs/model_comparison.csv · Chia train/holdout 80/20 (random_state=42)</text>
  <text x="1522" y="865" text-anchor="end" fill="#91aeba" font-size="14">Đồ họa 16:9 · phù hợp chèn vào slide PowerPoint</text>
</svg>
